<script>
    "use strict";

    (function () {
        const host = window.location.host;
        const response = JSON.parse(document.getElementById("response").textContent);

        const endpoints = document.getElementById("endpoints");
        const command = document.getElementById("command");
        const output = document.getElementById("output");
        const portField = document.getElementById("port");
        const ipField = document.getElementById("ip");

        let path = "";

        // The path and query the selected endpoint asks for.
        function request() {
            const address = ipField.value.trim();
            const query = address ? "?ip=" + encodeURIComponent(address) : "";
            const port = path === "port" ? "/" + (portField.value || "0") : "";

            return `/${path}${port}${query}`;
        }

        function render() {
            command.textContent = `curl -L ${host}${request()}`;
            output.textContent = preview();
        }

        // Only the current address is known here. Anything else has to be
        // fetched, which the command line above does.
        function preview() {
            if (ipField.value.trim()) {
                return "Open the request to see the answer for another address.";
            }
            switch (path) {
                case "":
                    return response.ip;
                case "json":
                    return JSON.stringify(response, null, 2);
                case "port":
                    return "Open the request to check the port.";
                default: {
                    const value = response[path.replace("-", "_")];
                    return value === undefined || value === "" ? "(not available for this address)" : String(value);
                }
            }
        }

        function selectEndpoint(button) {
            path = button.dataset.path;
            for (const chip of endpoints.querySelectorAll(".chip")) {
                chip.setAttribute("aria-pressed", String(chip === button));
            }
            portField.hidden = path !== "port";
            render();
        }

        endpoints.addEventListener("click", function (event) {
            const button = event.target.closest(".chip");
            if (button) {
                selectEndpoint(button);
            }
        });

        portField.addEventListener("input", render);
        ipField.addEventListener("input", render);

        document.getElementById("open").addEventListener("click", function () {
            window.location.assign(request());
        });

        document.getElementById("copy").addEventListener("click", async function (event) {
            const button = event.currentTarget;
            try {
                await navigator.clipboard.writeText(command.textContent);
                button.textContent = "Copied";
            } catch {
                button.textContent = "Press Ctrl+C";
            }
            setTimeout(function () {
                button.textContent = "Copy";
            }, 1500);
        });

        render();
    })();
</script>
