name: ci

on:
  push:
    branches: [master]
    # A version tag builds the image again, this time labelled with the
    # version. Without this the semver tags below are never produced.
    tags: ["v*"]
  pull_request:
    branches: [master]

env:
  DOCKER_IMAGE: ccharon/echoip

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      # Pinned by commit, because a tag can be moved to other code.
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      # govulncheck reports standard library vulnerabilities for the version it
      # runs with, so the check has to use the toolchain that builds the image.
      # A pattern that stops matching leaves an empty value, which fails the
      # comparison rather than passing quietly.
      - name: The Dockerfile and go.mod must name the same Go version
        run: |
          image=$(sed -n 's/^FROM .*golang:\([0-9][0-9.]*\)[-@ ].*/\1/p' Dockerfile)
          mod=$(sed -n 's/^go //p' go.mod)
          test "$image" = "$mod" || { echo "::error::Dockerfile has '$image', go.mod has '$mod'"; exit 1; }

      # setup-go v6 and later set GOTOOLCHAIN=local, so the job runs on the
      # version it installed from go.mod rather than downloading another.
      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod

      - name: Lint and test
        run: make lint test

      # Fails when a known vulnerability is reachable from this code. A
      # vulnerability in a dependency that nothing here calls is reported and
      # does not stop the build.
      - name: Check for known vulnerabilities
        run: make vulncheck

  docker:
    needs: check
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # Tags are what the version comes from.
          fetch-depth: 0

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      - name: Login to Docker Hub
        if: github.event_name == 'push'
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_TOKEN }}

      # latest says what is current, the commit tag says what exactly is
      # running and is what a rollback refers to.
      - name: Image tags
        id: meta
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6.2.0
        with:
          images: ${{ env.DOCKER_IMAGE }}
          tags: |
            type=raw,value=latest,enable={{is_default_branch}}
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=sha

      # A pull request builds for both platforms but publishes nothing. The
      # build itself needs no emulation, the Dockerfile cross compiles.
      - name: Build and push
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          build-args: |
            VERSION=${{ steps.meta.outputs.version }}
          push: ${{ github.event_name == 'push' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
          provenance: true
          sbom: true

      # Deployment is triggered by hand for now.
      # - name: Trigger deployment
      #   if: github.event_name == 'push'
      #   run: |
      #     curl -X POST ${{ secrets.WEBHOOK_URL }} -H "Content-Type: application/json" -d '{"id": "${{ github.run_id }}", "image": "${{ env.DOCKER_IMAGE }}", "token": "${{ secrets.WEBHOOK_TOKEN }}"}'
