name: ci

on:
  push:
    branches: [master]
    # A version tag builds the image again, this time labelled with the
    # version. Without this the semver tags below are never produced.
    tags: ["v*"]
  pull_request:
    branches: [master]

env:
  DOCKER_IMAGE: ccharon/echoip

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      # The Dockerfile decides which toolchain builds the image, and
      # govulncheck reports standard library vulnerabilities for the version it
      # runs with, so both have to agree.
      - name: Read the Go version from the Dockerfile
        id: go
        run: echo "version=$(sed -n 's/^FROM golang:\([0-9.]*\)-.*/\1/p' Dockerfile)" >> "$GITHUB_OUTPUT"

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: ${{ steps.go.outputs.version }}

      - name: Lint and test
        run: make lint test

      # Fails when a known vulnerability is reachable from this code. A
      # vulnerability in a dependency that nothing here calls is reported and
      # does not stop the build.
      - name: Check for known vulnerabilities
        run: make vulncheck

  docker:
    needs: check
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          # Tags are what the version comes from.
          fetch-depth: 0

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Login to Docker Hub
        if: github.event_name == 'push'
        uses: docker/login-action@v4
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_TOKEN }}

      # latest says what is current, the commit tag says what exactly is
      # running and is what a rollback refers to.
      - name: Image tags
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.DOCKER_IMAGE }}
          tags: |
            type=raw,value=latest,enable={{is_default_branch}}
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=sha

      # A pull request builds for both platforms but publishes nothing. The
      # build itself needs no emulation, the Dockerfile cross compiles.
      - name: Build and push
        uses: docker/build-push-action@v7
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          build-args: |
            VERSION=${{ steps.meta.outputs.version }}
          push: ${{ github.event_name == 'push' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
          provenance: true
          sbom: true

      # Deployment is triggered by hand for now.
      # - name: Trigger deployment
      #   if: github.event_name == 'push'
      #   run: |
      #     curl -X POST ${{ secrets.WEBHOOK_URL }} -H "Content-Type: application/json" -d '{"id": "${{ github.run_id }}", "image": "${{ env.DOCKER_IMAGE }}", "token": "${{ secrets.WEBHOOK_TOKEN }}"}'
