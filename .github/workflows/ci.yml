name: ci

on:
  push:
    branches: [main, develop]
    # A version tag builds the image again, this time labelled with the
    # version. Without this the semver tags below are never produced.
    tags: ["v*"]
  pull_request:
    branches: [main, develop]
  # A new vulnerability is published without any change here, so without this
  # the check only notices when someone next pushes. Only the check job runs on
  # a schedule, see the docker job.
  schedule:
    - cron: "17 5 * * 1"

# The jobs only read the repository. The image is pushed with the Docker Hub
# secrets, and provenance and sbom are attached to the image in the registry,
# so nothing here writes to GitHub.
permissions:
  contents: read

# A newer push to a pull request makes the older run pointless. Other runs are
# never cancelled, because one of them may be publishing the image.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  DOCKER_IMAGE: ccharon/echoip

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      # Pinned by commit, because a tag can be moved to other code.
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # Nothing here pushes to the repository.
          persist-credentials: false

      # govulncheck reports standard library vulnerabilities for the version it
      # runs with, so the check has to use the toolchain that builds the image.
      # A pattern that stops matching leaves an empty value, which fails the
      # comparison rather than passing quietly.
      - name: The Dockerfile and go.mod must name the same Go version
        run: |
          image=$(sed -n 's/^FROM .*golang:\([0-9][0-9.]*\)[-@ ].*/\1/p' Dockerfile)
          mod=$(sed -n 's/^go //p' go.mod)
          test "$image" = "$mod" || { echo "::error::Dockerfile has '$image', go.mod has '$mod'"; exit 1; }

      # setup-go v6 and later set GOTOOLCHAIN=local, so the job runs on the
      # version it installed from go.mod rather than downloading another.
      - name: Set up Go
        uses: actions/setup-go@d8cbb8045d7f43706b9177cceb36c1f91a6644d5 # v7.1.0
        with:
          go-version-file: go.mod

      # The race detector is slower, so it runs here and not in make test.
      - name: Lint and test
        run: make lint test-race

      # Fails when a known vulnerability is reachable from this code. A
      # vulnerability in a dependency that nothing here calls is reported and
      # does not stop the build.
      - name: Check for known vulnerabilities
        run: make vulncheck

  docker:
    needs: check
    # A scheduled run is on main and would otherwise push the image again
    # although nothing changed. It only has to look for vulnerabilities.
    if: github.event_name != 'schedule'
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # Tags are what the version comes from.
          fetch-depth: 0
          persist-credentials: false

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      - name: Login to Docker Hub
        if: ${{ github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/v') }}
        uses: docker/login-action@8aa5831fb8d48d8f76594c7ddde61ae58019f550 # v4.8.0
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_TOKEN }}

      # latest says what is current, the commit tag says what exactly is
      # running and is what a rollback refers to.
      - name: Image tags
        id: meta
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6.2.0
        with:
          images: ${{ env.DOCKER_IMAGE }}
          tags: |
            type=raw,value=latest,enable={{is_default_branch}}
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=sha

      # Only main and a version tag publish. A pull request and develop are
      # built for both platforms and thrown away. The build itself needs no
      # emulation, the Dockerfile cross compiles.
      - name: Build and push
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          build-args: |
            VERSION=${{ steps.meta.outputs.version }}
          push: ${{ github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/v') }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
          provenance: true
          sbom: true

      # Deployment is triggered by hand for now.
      # - name: Trigger deployment
      #   if: github.event_name == 'push'
      #   run: |
      #     curl -X POST ${{ secrets.WEBHOOK_URL }} -H "Content-Type: application/json" -d '{"id": "${{ github.run_id }}", "image": "${{ env.DOCKER_IMAGE }}", "token": "${{ secrets.WEBHOOK_TOKEN }}"}'
